<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' file:" />
    <title>The Bureau</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="herdr-pane" class="pane">
        <div id="herdr-terminal" class="term"></div>
      </section>
      <div id="split-vertical" class="splitter vertical"></div>
      <section id="right">
        <section id="shell-pane" class="pane">
          <nav class="tabbar"><div class="tab-add">+</div></nav>
          <div class="tabbody"></div>
        </section>
        <div id="split-horizontal" class="splitter horizontal"></div>
        <section id="stage" class="pane">
          <canvas id="office"></canvas>
          <div id="error" class="hidden"></div>
        </section>
      </section>
    </main>
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="layout.js"></script>
    <script src="world.js"></script>
    <script src="sprites.js"></script>
    <script src="terminals.js"></script>
    <script src="office.js"></script>
  </body>
</html>
